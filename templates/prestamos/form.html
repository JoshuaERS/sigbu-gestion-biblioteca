{% extends "base.html" %}{% block content %}<section class="card"><h2>Nuevo préstamo</h2><form method="post"><label>Usuario<select name="usuario_id" required>{% for u in usuarios %}<option value="{{ u.id }}">{{ u.codigo }} · {{ u.nombre }}</option>{% endfor %}</select></label><label>Ejemplar disponible<select name="ejemplar_id" required>{% for e in ejemplares %}<option value="{{ e.id }}">{{ e.codigo_inventario }} · {{ e.titulo }}</option>{% endfor %}</select></label><button>Registrar préstamo</button></form></section>{% endblock %}

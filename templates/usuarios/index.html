{% extends "base.html" %}{% block content %}<section class="card"><div class="actions"><h2>Usuarios</h2><a class="button" href="{{ url_for('usuarios.nuevo') }}">Nuevo usuario</a></div><table><thead><tr><th>Código</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead><tbody>{% for u in usuarios %}<tr><td>{{ u.codigo }}</td><td>{{ u.nombre }}</td><td>{{ u.correo }}</td><td>{{ u.rol }}</td><td>{{ 'Activo' if u.activo else 'Inactivo' }}</td></tr>{% else %}<tr><td colspan="5">No hay usuarios.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
